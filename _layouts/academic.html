<!doctype html>
<html lang="en" class="no-js">
<head>
  {% include head.html %}
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/InterVariable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {% if page.math %}<link rel="stylesheet" href="{{ '/assets/vendor/katex/katex.min.css' | relative_url }}"><script defer src="{{ '/assets/vendor/katex/katex.min.js' | relative_url }}"></script><script defer src="{{ '/assets/vendor/katex/auto-render.min.js' | relative_url }}"></script>{% endif %}
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":{{ site.data.profile.name | jsonify }},"alternateName":{{ site.data.profile.alternate_name | jsonify }},"url":{{ site.data.profile.website | jsonify }},"image":{{ site.data.profile.portrait | absolute_url | jsonify }},"sameAs":[{{ site.data.profile.github | jsonify }},{{ site.data.profile.orcid | jsonify }}],"knowsAbout":["Computational neuroscience","Cognitive neuroscience","Neurolinguistics"]}</script>
</head>
<body class="academic-site">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="academic-header">
    <div class="site-wrap header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
      <button class="menu-toggle icon-button" aria-label="Open navigation" aria-expanded="false" aria-controls="main-navigation" hidden><i class="fas fa-bars" aria-hidden="true"></i></button>
      <nav class="site-navigation" id="main-navigation" aria-label="Main navigation">
        {% for item in site.data.navigation.main %}<a href="{% unless item.url contains 'https://' %}{{ site.baseurl }}{% endunless %}{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="academic-footer"><div class="site-wrap footer-inner"><p>{{ site.data.profile.name }} &middot; Updated {{ site.data.profile.updated | date: '%B %Y' }}</p><p><a href="mailto:{{ site.data.profile.email }}">Email</a><a href="{{ site.data.profile.github }}">GitHub</a><a href="{{ site.data.profile.orcid }}">ORCID</a></p></div></footer>
  <dialog class="figure-dialog" aria-label="Research figure"><form method="dialog"><button class="icon-button" aria-label="Close figure"><i class="fas fa-times" aria-hidden="true"></i></button></form><img alt=""><p class="figure-dialog__caption"></p></dialog>
  <p class="interaction-status" role="status" aria-live="polite"></p>
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
</body>
</html>
