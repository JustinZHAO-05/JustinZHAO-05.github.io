- id: cognitive-turn
  dates: 2025-2026
  stage: Year 3
  title: Turning Toward Language and Cognition
  phase: cognition
  icon: fa-book-open
  summary: "My experience of language learning drew me toward the neural mechanisms of language acquisition and prediction. I took courses in brain and cognitive science, medical signal processing, machine learning, and deep learning, while studying Bermúdez, Dayan and Abbott, and related papers in computational and cognitive neuroscience."
