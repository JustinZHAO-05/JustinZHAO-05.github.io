- id: present
  dates: Jul 2026-Present
  stage: Year 4
  title: Neural Dynamics, Language & Subjective Experience
  phase: research
  icon: fa-wave-square
  summary: "My current work investigates representational drift and sparsity in longitudinal neural recordings, computational mechanisms of drift, and circadian clock networks for my undergraduate thesis. Alongside these projects, I am pursuing exploratory work on language and experience, with a growing interest in how neural cognition emerged through evolution."
  reflection: "Connecting neural dynamics with cognition, evolutionary history, and conscious experience."
