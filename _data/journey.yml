- id: robot-research
  dates: Jul-Aug 2025
  stage: Summer before Year 3
  title: Learning-Based Robot Navigation
  phase: computation
  icon: fa-route
  summary: "During in-person summer research supervised by Sen Wang, I worked on deep reinforcement learning for robots escaping narrow dead ends under nonholonomic constraints. The project led to the CSAI 2025 paper and sharpened my interest in the flexibility of biological learning beyond a task's training environment."
  reflection: "From successful policies to questions about generalization and biological intelligence."
