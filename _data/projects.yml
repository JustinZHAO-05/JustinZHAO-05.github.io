- id: medical-signal-spectral-estimation-eeg
  title: "EEG Spectral Estimation"
  priority: 1
  category: "Neuroscience / Signals"
  category_slug: "neuroscience-signals"
  status: "Reproducible lab project"
  summary: "A reproducible study of classical and AR spectral estimators on synthetic signals and LEMON closed-eye resting-state EEG."
  role: "Designed the experiments, implemented the analysis pipeline, produced report figures, and wrote the technical report."
  methods: "FFT, Hamming periodogram, autocorrelation PSD, Welch PSD, Yule-Walker AR spectra, FPE order selection"
  stack: "Python, NumPy, SciPy, Matplotlib, EEG signal analysis"
  thumbnail: "/images/projects/spectral-estimation.png"
  links:
    github: "https://github.com/JustinZHAO-05/medical-signal-spectral-estimation-eeg"
    report: "https://github.com/JustinZHAO-05/medical-signal-spectral-estimation-eeg/blob/main/outputs/pdf/Spectral_Estimation_Lab_Report_EN.pdf"
  highlights:
    - "Compared estimator bias, variance, leakage, resolution, and pseudo-peak behavior."
    - "Connected signal-processing choices to interpretable EEG alpha-band analysis."
    - "Maintained absolute one-sided PSD reporting in dB/Hz for reproducible comparison."

- id: medical-signal-filtering-erp-analysis
  title: "ERP Filtering and EEG Preprocessing"
  priority: 2
  category: "Neuroscience / Signals"
  category_slug: "neuroscience-signals"
  status: "Reproducible lab project"
  summary: "A complete ERP filtering study covering IIR/FIR filter design, EEG preprocessing, waveform interpretation, and bilingual reporting."
  role: "Implemented filter comparisons, ERP analysis, quantitative summaries, and publication-style reports."
  methods: "IIR/FIR filter design, zero-phase filtering, delay analysis, baseline drift suppression, ERP waveform comparison"
  stack: "Python, SciPy, EEG/ERP analysis, technical reporting"
  thumbnail: "/images/projects/erp-filtering.png"
  links:
    github: "https://github.com/JustinZHAO-05/medical-signal-filtering-erp-analysis"
    report: "https://github.com/JustinZHAO-05/medical-signal-filtering-erp-analysis/blob/main/output_en/report/medical_signal_filter_report_en.pdf"
  highlights:
    - "Compared Butterworth, Chebyshev-I/II, and elliptic IIR filters under matched specifications."
    - "Measured latency distortion from causal filtering and corrected interpretation with zero-phase filtering."
    - "Used real ERP data to connect filter design to cognitive-neuroscience waveform analysis."

