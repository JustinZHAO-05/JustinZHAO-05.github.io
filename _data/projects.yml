- id: hp-gsbs
  title: HP-GSBS
  subtitle: Efficient neural-state segmentation
  priority: 1
  featured: true
  category: Neural Data and Methods
  category_slug: neuroscience-signals
  status: Under review at Neuroinformatics
  summary: "Reusable interval statistics and CPU/GPU implementations for fast, reproducible segmentation of neural recordings."
  role: "Core algorithm and code contributions, experimental analysis, and manuscript writing."
  methods: "Neural-state segmentation, interval statistics, CPU/CUDA/Triton implementation, numerical validation, EEG and fMRI analysis"
  stack: "Python, NumPy, Numba, PyTorch, CUDA, Triton"
  thumbnail: /images/research/hp-gsbs-eeg.png
  caption: "EEG segmentation and cross-backend agreement. Original figure from the HP-GSBS reproducibility materials."
  detail: /research/hp-gsbs/
  question: "How can neural-state segmentation be made computationally practical while retaining the reference method's outputs?"
  approach: "Reformulated repeated template scoring into additive interval contributions and t-distance into reusable correlation statistics. Implemented a common sequential search controller with CPU, PyTorch CUDA and Triton computation paths."
  results: "Controlled same-input benchmarks in the paper report 154-1,730-fold median speedups. All 168 tested optimized executions reproduce complete reference boundary histories and selected state counts. EEG and naturalistic fMRI analyses extend evaluation to neural recordings."
  links:
    github: https://github.com/JustinZHAO-05/HP-GSBS
    paper: https://arxiv.org/abs/2610.25898
  highlights:
    - "Mathematical reformulation of repeated computation into reusable statistics."
    - "Reference-output validation and controlled performance measurements."
    - "Application to EEG and naturalistic fMRI datasets."
- id: temporal-irreversibility
  title: Observation Architecture and Temporal Irreversibility
  subtitle: Identifiability of temporal structure in neural recordings
  priority: 2
  featured: true
  category: Theoretical Neuroscience
  category_slug: neuroscience-signals
  status: Submitted to Physical Review E
  summary: "A theoretical investigation of how measurement structure shapes inference about the arrow of time in multichannel signals."
  role: "Sole-author theoretical research, mathematical analysis, numerical experiments, and EEG validation."
  methods: "Stationary Gaussian processes, spectral matrices, identifiability, spectral-cycle invariants, finite-sample calibration"
  stack: "Python, NumPy, SciPy, spectral analysis, mathematical modeling"
  thumbnail: /images/research/temporal-irreversibility.png
  caption: "Original manuscript figure: observation architecture and temporal irreversibility."
  detail: /research/temporal-irreversibility/
  question: "What observation assumptions allow temporal asymmetry in a recording to inform us about latent dynamics?"
  approach: "Derived identifiability results for stationary Gaussian processes, reversible-latent observation constructions, resource bounds and filter-invariant spectral-cycle quantities. Connected these results to finite-record calibration and human EEG analysis."
  results: "The study characterizes observational equivalence, identifies structural assumptions that preserve informative invariants, and develops finite-sample lower bounds. EEG coordinate transformations and rereferencing illustrate the importance of the observation basis."
  links:
    github: https://github.com/JustinZHAO-05/observation-architecture-temporal-irreversibility
    paper: https://doi.org/10.5281/zenodo.24400331
  highlights:
    - "Theoretical results linking latent dynamics and measurement structure."
    - "Spectral invariants, resource bounds and finite-record calibration."
    - "Human EEG analyses of observation-basis dependence."
- id: temporal-persistence
  title: Temporal Persistence of Perceptual Inference
  subtitle: Neuromatch 2026, Team Doraemon
  priority: 3
  featured: true
  category: Neuroscience and Cognition
  category_slug: cognition
  status: Completed research project
  summary: "Latent-state models of how sensory-reliant and prior-reliant inference modes persist across perceptual decisions."
  role: "Conceived the central project idea, contributed substantially to code and analyses, and co-presented the final team project."
  methods: "Hidden Markov models, von Mises emissions, run-level cross-validation, model comparison, posterior predictive checks"
  stack: "Python, NumPy, SciPy, statistical modeling"
  thumbnail: /images/research/neuromatch-persistence.png
  caption: "Posterior state occupancy and temporal organization. Original figure from the Team Doraemon project."
  detail: /research/temporal-persistence/
  question: "Do perceptual inference strategies persist over time as observers combine sensory evidence with prior expectations?"
  approach: "The team reanalyzed 83,210 usable motion-direction estimates from 12 participants across 388 run-level sequences. Compared memoryless switching, serial-dependence baselines and static/covariate HMMs using run-level cross-validation."
  results: "Persistent-state models improved held-out prediction within the tested model comparison. Posterior predictive checks and block-level analyses further characterize model fit and the temporal structure captured by the models."
  links:
    github: https://github.com/JustinZHAO-05/Temporal-Persistence-of-Perceptual-Inference-by-Group-Doraemon-Neuromatch-CN-2026
    report: /files/reports/neuromatch-perceptual-inference.html
    video: https://youtu.be/NiODNrcgzmI
  highlights:
    - "Project conception and substantial contributions to computational analysis."
    - "Behavioral modeling with sequence-level cross-validation."
    - "Team presentation, open code, figures and technical report."
