interests_short: "I am interested in how neural population dynamics give rise to cognition across biological levels and evolution, including the neural mechanisms of language processing, language acquisition, and conscious experience."
interests: "My research interests lie in computational and cognitive neuroscience and neurolinguistics. I am interested in how neural population dynamics implement cognition across levels of biological organization, how neurally based cognitive capacities emerge through evolution, the neural mechanisms of language processing and acquisition, and the neural basis of conscious subjective experience."
